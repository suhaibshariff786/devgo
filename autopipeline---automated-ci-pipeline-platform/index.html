<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPipeline | Automated CI/CD Pipeline Simulator & Lab</title>
    <script>
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason) {
          var msg = (e.reason.message || String(e.reason)).toLowerCase();
          if (msg.includes('websocket') || msg.includes('vite') || msg.includes('closed without opened')) {
            e.preventDefault();
          }
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"Fira Code"', 'monospace'],
            },
            colors: {
              ci: {
                bg: '#0B0F19',
                card: '#111827',
                border: '#1F2937',
                accent: '#38BDF8',
                success: '#10B981',
                failed: '#EF4444',
                warning: '#F59E0B',
                queued: '#6B7280'
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#0B0F19] text-slate-100 font-sans antialiased selection:bg-sky-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
